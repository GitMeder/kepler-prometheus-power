# Example Kepler configuration for "Prometheus-based node power input"
# Use this when an external system (e.g., PDU + exporter + recording rules)
# already provides a power metric (watts), and Kepler should attribute it to processes.

log:
  level: info           # debug, info, warn, error
  format: text          # text or json

host:
  sysfs: /sys
  procfs: /proc

monitor:
  interval: 5s
  staleness: 30s        # how long samples may be considered valid

exporter:
  prometheus:
    enabled: true
    metricsLevel:
      - node
      - process
      # - container
      # - vm
      # - pod

web:
  listenAddresses:
    - 0.0.0.0:28282
    - :28443
  configFile: /etc/kepler/web-config.yml

kube:
  enabled: false
  # config: ""
  # nodeName: ""

dev:
  fake-cpu-meter:
    enabled: false

# Disable RAPL zones in this example, because node power comes from Prometheus.
rapl:
  enabled: false
  zones: []

experimental:
  prometheus-power:
    enabled: true
    baseURL: https://vmuser:VMInHochschule@192.168.64.1:8428
    query: device_power_watts_avg{room="R3.033",rack="Rack 3",device="kub01"}

  platform:
    redfish:
      enabled: false

  hwmon:
    enabled: false
    
  gpu:
    enabled: false
