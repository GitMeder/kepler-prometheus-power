apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{include "kepler.fullname" .}}
  namespace: {{include "kepler.namespace" .}}
  labels:
    {{- include "kepler.labels" . | nindent 4}}
  {{- with .Values.annotations}}
  annotations:
    {{- toYaml . | nindent 4}}
  {{- end}}
spec:
  selector:
    matchLabels:
      {{- include "kepler.selectorLabels" . | nindent 6}}
  template:
    metadata:
      labels:
        {{- include "kepler.selectorLabels" . | nindent 8 }}
        {{- with .Values.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kepler.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostPID: {{ .Values.daemonset.hostPID }}
      hostUsers: {{ .Values.daemonset.hostUsers }}
      {{- with .Values.daemonset.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kepler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.daemonset.securityContext | nindent 12 }}
          command:
            - /usr/bin/kepler
          args:
            - --config.file=/etc/kepler/config.yaml
            - --kube.enable
            - --kube.node-name=$(NODE_NAME)
          ports:
            - name: http
              containerPort: 28282
              protocol: TCP
          volumeMounts:
            - name: node-device-map
              mountPath: /etc/kepler/node-device-map
              readOnly: true
            - name: prompower-ca
              mountPath: /etc/prompower-ca
              readOnly: true
              {{- if .Values.prompowerAuth.secretName }}
            - name: prompower-auth
              mountPath: {{ .Values.prompowerAuth.mountPath }}
              readOnly: true
              {{- end }}
            - name: sysfs
              mountPath: /host/sys
              readOnly: true
            - name: procfs
              mountPath: /host/proc
              readOnly: true
            - name: cfm
              mountPath: /etc/kepler
          {{- with .Values.daemonset.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.daemonset.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.daemonset.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            # Required for NVML to see all MIG devices when running in a container
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_MIG_MONITOR_DEVICES
              value: "all"
          {{- with .Values.daemonset.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.vmagent.enabled }}
        - name: vmagent
          image: "{{ .Values.vmagent.image.repository }}:{{ .Values.vmagent.image.tag }}"
          imagePullPolicy: {{ .Values.vmagent.image.pullPolicy }}
          args:
            - -promscrape.config=/etc/vmagent/vmagent-scrape.yaml
            - -remoteWrite.url={{ .Values.vmagent.remoteWrite.url }}
            - -remoteWrite.basicAuth.username={{ .Values.vmagent.remoteWrite.username }}
            - -remoteWrite.basicAuth.passwordFile=/etc/vmagent-remote-write/password
            - -remoteWrite.tlsCAFile={{ .Values.vmagent.remoteWrite.caFile }}
          volumeMounts:
            - name: cfm
              mountPath: /etc/vmagent
              readOnly: true
            - name: vm-remote-write-auth
              mountPath: /etc/vmagent-remote-write
              readOnly: true
            - name: prompower-ca
              mountPath: /etc/prompower-ca
              readOnly: true
          {{- with .Values.vmagent.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.vmagent.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.vmagent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
      volumes:
        - name: node-device-map
          configMap:
            name: kepler-node-device-map
        - name: prompower-ca
          secret:
            secretName: vm-ca-cert
        - name: sysfs
          hostPath:
            path: /sys
        - name: procfs
          hostPath:
            path: /proc
        - name: cfm
          configMap:
            name: {{ include "kepler.fullname" . }}
          {{- if .Values.vmagent.enabled }}
        - name: vm-remote-write-auth
          secret:
            secretName: {{ .Values.vmagent.remoteWrite.passwordSecretName }}
          {{- end }}
          {{- if .Values.prompowerAuth.secretName }}
        - name: prompower-auth
          secret:
            secretName: {{ .Values.prompowerAuth.secretName }}
          {{- end }}
